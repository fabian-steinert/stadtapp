name: Build and Deploy

on:
  push:
    branches:
      - main

env:
  IMAGE: ghcr.io/${{ github.repository }}:latest

jobs:
  deploy:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ env.IMAGE }}

      - name: Prepare Portainer compose
        run: |
          sudo snap install yq
          yq -i '
            .services.app.image = strenv(IMAGE) |
            del(.services.app.build)
          ' docker-compose.yml

          cat docker-compose.yml

      - name: Get current Portainer stack
        env:
          API_HOST: ${{ secrets.PORTAINER_API_HOST }}
          API_KEY: ${{ secrets.PORTAINER_API_KEY }}
          STACK_ID: ${{ secrets.PORTAINER_STACK_ID }}
        run: |
          curl --fail-with-body --show-error \
            "$API_HOST/api/stacks/$STACK_ID" \
            -H "X-API-KEY: $API_KEY" \
            > stack.json

      - name: Update Portainer
        env:
          API_HOST: ${{ secrets.PORTAINER_API_HOST }}
          API_KEY: ${{ secrets.PORTAINER_API_KEY }}
          STACK_ID: ${{ secrets.PORTAINER_STACK_ID }}
          ENDPOINT_ID: ${{ secrets.PORTAINER_ENDPOINT_ID }}
        run: |
          FILE=$(jq -Rs . < docker-compose.yml)
          ENV=$(jq '.Env // []' stack.json)

          jq -n \
            --argjson file "$FILE" \
            --argjson env "$ENV" \
            --argjson id "$STACK_ID" \
            '{
              Env: $env,
              id: $id,
              Prune: false,
              PullImage: true,
              StackFileContent: $file
            }' |
          curl --fail-with-body --show-error \
            -X PUT \
            "$API_HOST/api/stacks/$STACK_ID?endpointId=$ENDPOINT_ID" \
            -H "Content-Type: application/json" \
            -H "X-API-KEY: $API_KEY" \
            --data-binary @-

name: Build and Deploy

on:
  push:
    branches:
      - main

env:
  REGISTRY: ghcr.io

jobs:
  deploy:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ env.REGISTRY }}/${{ github.repository }}:latest

      - name: Create deployment compose
        run: |
          mkdir -p deploy

          cat > deploy/docker-compose.yml <<EOF
          services:
            app:
              image: ${{ env.REGISTRY }}/${{ github.repository }}:latest
              ports:
                - "\${PORT:-3000}:3000"
          EOF

      - name: Show deployment compose
        run: cat deploy/docker-compose.yml

      - name: Deploy to Portainer
        run: |
          curl --fail --show-error --silent \
            --retry 3 --retry-delay 5 \
            -X POST "https://portainer.oepgv.de/api/stacks/webhooks/0fc2e220-222d-4379-8cc2-935b7768facc"
